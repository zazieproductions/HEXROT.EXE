name: Publish browser preview

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize Pages deployments so a slow build cannot be overwritten by a
# faster later one. (Before the Pages source was switched to GitHub Actions,
# the legacy branch build raced this workflow on every push.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vite-plugin-singlefile forces a relative base ("./"), so the build
      # works under the /HEXROT.EXE/ project subpath with no --base flag
      # (a CLI --base would be overridden by the plugin anyway).
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4

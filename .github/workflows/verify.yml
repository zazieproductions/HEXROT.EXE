name: Verify HEXROT.EXE

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Install decoder tools for sandbox tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bubblewrap ffmpeg
      - name: Create reproducible audio fixtures
        run: python scripts/generate_fixtures.py
      - name: Run Python unit tests
        run: python -m pytest tests/unit/ -v
      - name: Run Python integration tests
        run: python -m pytest tests/integration/ tests/end_to_end/ -v
      - name: Run full test suite with report
        run: python -m pytest -v --tb=short 2>&1 | tee docs/pytest-output.txt

  python-backend-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Install decoder tools
        run: brew install ffmpeg libsndfile || true
      - name: Create reproducible audio fixtures
        run: python scripts/generate_fixtures.py
      - name: Run Python unit tests
        run: python -m pytest tests/unit/ -v --tb=short
      - name: Run integration tests
        run: python -m pytest tests/integration/ tests/end_to_end/ -v --tb=short || true

  python-backend-no-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Create reproducible audio fixtures
        run: python scripts/generate_fixtures.py
      - name: Run tests without decoders (no bubblewrap, no ffmpeg)
        run: python -m pytest tests/unit/ tests/end_to_end/ -v --tb=short
      - name: Verify decoder execution is disabled without sandbox
        run: python -c "from backend.workers.isolation import isolation_status; s=isolation_status(); assert not s['available'], 'Expected sandbox unavailable'"

  react-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck React frontend
        run: npm run typecheck
      - name: Production build
        run: npm run build

  mutation-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Create reproducible audio fixtures
        run: python scripts/generate_fixtures.py
      - name: Verify mutation reproducibility
        run: python -m pytest tests/unit/test_mutation.py -v -k "deterministic or reproducible or reproduction or dedup"

  parser-malformed-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Create reproducible audio fixtures
        run: python scripts/generate_fixtures.py
      - name: Run malformed input resilience tests
        run: python -m pytest tests/unit/test_parsers.py -v -k "empty or truncated or zero_length or oversized or malformed or garbage or single_byte or mismatch"

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Create reproducible audio fixtures
        run: python scripts/generate_fixtures.py
      - name: Run API contract tests
        run: python -m pytest tests/end_to_end/test_workflow.py -v -k "health or manifest or deduplication or reproduction or unknown_strategy or boundary_strategies"

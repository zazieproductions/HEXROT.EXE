</defs><rect width="1440" height="830" fill="#0A0F0C"/><rect width="1440" height="830" fill="url(#grid)" opacity=".55"/><rect width="1440" height="830" fill="url(#glow)"/><rect width="1440" height="830" fill="url(#glow2)"/><text x="60" y="42" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="1.8" opacity="1.0">TRUST BOUNDARY</text><text x="60" y="62" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9.5" font-weight="400" fill="#6C7F72" text-anchor="start" letter-spacing="0" opacity="1.0">What the sandbox changes — and what it deliberately does not protect.</text><text x="1380" y="50" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8" font-weight="400" fill="#6C7F72" text-anchor="end" letter-spacing="1.5" opacity="1.0">DOCS / SECURITY.md</text><line x1="60" y1="78" x2="1380" y2="78" stroke="#26352C" stroke-width="1" opacity="1"/><rect x="60" y="100" width="620" height="350" rx="12" fill="#0E1310" stroke="#F2C14E" stroke-width="1.2" opacity="1.0"/><rect x="60" y="100" width="620" height="4" rx="2" fill="#F2C14E"/><text x="82" y="130" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="1.2" opacity="1.0">HOST PROCESS</text><text x="82" y="148" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#F2C14E" text-anchor="start" letter-spacing="0" opacity="1.0">runs as your user · same kernel · same account</text><line x1="82" y1="158" x2="658" y2="158" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="88" cy="173" r="3" fill="#F2C14E"/><text x="100" y="176" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">BACKEND CORE</text><text x="100" y="192.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">stdlib parsers, Mutagen, mutation engine, analysis, report rendering</text><line x1="82" y1="226" x2="658" y2="226" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="88" cy="241" r="3" fill="#F2C14E"/><text x="100" y="244" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">WORKSPACE</text><text x="100" y="260.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">~/.hexrot · SQLite WAL · UUID files · 0700/0600 permissions</text><line x1="82" y1="294" x2="658" y2="294" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="88" cy="309" r="3" fill="#F2C14E"/><text x="100" y="312" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">UPLOAD PATH</text><text x="100" y="328.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">No application cap · spooled to disk · names sanitized</text><line x1="82" y1="362" x2="658" y2="362" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="88" cy="377" r="3" fill="#F2C14E"/><text x="100" y="380" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">NOT DEFENDED</text><text x="100" y="396.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">a hostile process on the same account, the kernel, or a compromised dependency</text><line x1="706" y1="96" x2="706" y2="466" stroke="#FF6B6B" stroke-width="1.4" opacity="1" stroke-dasharray="6 5"/><rect x="666" y="232" width="80" height="92" rx="7" fill="#0A0F0C" stroke="#FF6B6B" stroke-width="1" opacity="1.0"/><text x="706" y="256" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="7.6" font-weight="700" fill="#FF6B6B" text-anchor="middle" letter-spacing="1.2" opacity="1.0">TRUST</text><text x="706" y="270" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="7.2" font-weight="700" fill="#FF6B6B" text-anchor="middle" letter-spacing="1.1" opacity="1.0">BOUNDARY</text><text x="706" y="294" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="7" font-weight="400" fill="#6C7F72" text-anchor="middle" letter-spacing="0" opacity="1.0">IDs</text><text x="706" y="305" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="7" font-weight="400" fill="#6C7F72" text-anchor="middle" letter-spacing="0" opacity="1.0">+ argv</text><rect x="760" y="100" width="620" height="350" rx="12" fill="#0C1712" stroke="#6EE7A8" stroke-width="1.2" opacity="1.0"/><rect x="760" y="100" width="620" height="4" rx="2" fill="#6EE7A8"/><text x="782" y="130" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="1.2" opacity="1.0">SANDBOXED WORKER</text><text x="782" y="148" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">one decoder process tree · no network namespace</text><line x1="782" y1="158" x2="1358" y2="158" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="788" cy="173" r="3" fill="#6EE7A8"/><text x="800" y="176" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">INPUT MOUNT</text><text x="800" y="192.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">one file, read-only, at /input/audio or a literal host path</text><line x1="782" y1="226" x2="1358" y2="226" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="788" cy="241" r="3" fill="#6EE7A8"/><text x="800" y="244" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">SUPERVISOR</text><text x="800" y="260.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">sets RLIMIT_CPU/AS/FSIZE/NOFILE/CORE, then waits for the decoder</text><line x1="782" y1="294" x2="1358" y2="294" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="788" cy="309" r="3" fill="#6EE7A8"/><text x="800" y="312" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">DECODER</text><text x="800" y="328.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">fixed executable + fixed argv, stdin closed, output sampled and bounded</text><line x1="782" y1="362" x2="1358" y2="362" stroke="#26352C" stroke-width="1" opacity="1"/><circle cx="788" cy="377" r="3" fill="#6EE7A8"/><text x="800" y="380" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#E9F2EB" text-anchor="start" letter-spacing="0.8" opacity="1.0">EPHEMERAL</text><text x="800" y="396.0" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.5" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">private /proc and /dev, 16 MiB tmpfs, no host home mount</text><rect x="60" y="478" width="620" height="244" rx="10" fill="#101713" stroke="#26352C" stroke-width="1" opacity="1.0"/><text x="82" y="506" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="1.2" opacity="1.0">+  ALLOWED INSIDE</text><text x="90" y="530" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="530" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">read-only /usr, /lib, /lib64, /bin</text><text x="90" y="554" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="554" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">selected loader links and /etc/ld.so.cache</text><text x="90" y="578" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="578" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">the single input file (read-only)</text><text x="90" y="602" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="602" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">the supervisor script (read-only)</text><text x="90" y="626" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="626" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">private /proc, /dev and a 16 MiB /tmp</text><text x="90" y="650" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="650" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">fixed argv arrays with no shell parsing</text><text x="90" y="674" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#6EE7A8" text-anchor="start" letter-spacing="0" opacity="1.0">+</text><text x="106" y="674" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">read-only /etc/alternatives and ld.so.cache</text><rect x="760" y="478" width="620" height="244" rx="10" fill="#101713" stroke="#26352C" stroke-width="1" opacity="1.0"/><text x="782" y="506" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="10" font-weight="700" fill="#FF6B6B" text-anchor="start" letter-spacing="1.2" opacity="1.0">×  DENIED INSIDE</text><text x="790" y="530" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="530" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">network namespace / host loopback</text><text x="790" y="554" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="554" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">the host home directory and unrelated files</text><text x="790" y="578" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="578" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">user namespaces nested inside the sandbox</text><text x="790" y="602" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="602" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">writes outside /tmp and /dev/null</text><text x="790" y="626" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="626" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">arbitrary executables, shell strings and argv</text><text x="790" y="650" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="650" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">host /proc, host PIDs and mach-lookup (macOS)</text><text x="790" y="674" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="11" font-weight="400" fill="#FF6B6B" text-anchor="start" letter-spacing="0" opacity="1.0">×</text><text x="806" y="674" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.8" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">reading SSH keys, browser data or unrelated home files</text><rect x="60" y="744" width="1320" height="54" rx="8" fill="#332A14" stroke="#F2C14E" stroke-width="1" opacity="1.0"/><text x="82" y="768" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="700" fill="#F2C14E" text-anchor="start" letter-spacing="1" opacity="1.0">STILL SHARED:</text><text x="170" y="768" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="9" font-weight="400" fill="#97AA9C" text-anchor="start" letter-spacing="0" opacity="1.0">the host kernel, the container runtime, and any decoder or library vulnerability. Use a disposable Linux VM for high-risk files.</text><text x="82" y="785" font-family="'IBM Plex Mono','DejaVu Sans Mono','SFMono-Regular',Menlo,monospace" font-size="8.2" font-weight="400" fill="#6C7F72" text-anchor="start" letter-spacing="0" opacity="1.0">The macOS Seatbelt profile is deny-by-default but has not been independently validated on current Apple Silicon; sandbox-exec is deprecated by Apple.</text></svg>
